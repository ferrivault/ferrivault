name: Feature Request
description: Suggest a new feature or enhancement for FerriVault
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: Is your feature request related to a problem or missing Bitwarden/Vaultwarden capability?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or UX you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative workarounds or designs you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or references to Bitwarden behavior.

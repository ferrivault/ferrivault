name: Bug Report
description: Report a bug or unexpected behavior in FerriVault
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open FerriVault
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Wayland)
        - Linux (X11)
        - Windows 10 / 11
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server Environment
      options:
        - Bitwarden Official (US - bitwarden.com)
        - Bitwarden Official (EU - bitwarden.eu)
        - Self-Hosted (Vaultwarden)
        - Self-Hosted (Bitwarden Unified / Other)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FerriVault Version
      description: e.g. v0.1.0 or commit hash
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Any relevant terminal output, error messages, or screenshots (please redact any sensitive data or tokens!).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-tauri:
    name: Build & Release (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            platform: ubuntu-26.04
            args: --target x86_64-unknown-linux-gnu
          - label: Windows x86_64
            platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - label: macOS Apple Silicon (arm64)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macOS Intel (x86_64)
            platform: macos-latest
            args: --target x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from Git tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.TAG_NAME.replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+/.test(version)) {
              console.log("Skipping non-semver tag:", process.env.TAG_NAME);
              process.exit(0);
            }
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              data.version = version;
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(
              /(\[package\][\s\S]*?^version\s*=\s*)"[^"]+"/m,
              `$1"${version}"`
            );
            fs.writeFileSync(cargoPath, cargo);
            console.log("Synced version to", version);
          '

      - name: Build and upload Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: FerriVault v__VERSION__
          releaseBody: |
            ## FerriVault v__VERSION__

            Cross-platform desktop client for **Bitwarden** and **Vaultwarden**, built with **Rust** and **Tauri v2**.

            ### Downloads
            - **Linux (x86_64)**: `.AppImage`, `.deb`, `.rpm`
            - **Windows (x86_64)**: `.msi`, `-setup.exe`
            - **macOS (Apple Silicon `aarch64` & Intel `x86_64`)**: `.dmg`

            > **Note:** macOS and Windows binaries are currently unsigned. On macOS, if Gatekeeper blocks the app on first launch, run `xattr -cr /Applications/FerriVault.app`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
